<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050106"/>
      <stop offset="35%" stop-color="#14020A"/>
      <stop offset="70%" stop-color="#09010C"/>
      <stop offset="100%" stop-color="#020712"/>
    </linearGradient>

    <!-- Iron Spider Red Armor Gradient -->
    <linearGradient id="armorRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF1E38"/>
      <stop offset="40%" stop-color="#C7001E"/>
      <stop offset="80%" stop-color="#800010"/>
      <stop offset="100%" stop-color="#380005"/>
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="starkGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFE57F"/>
      <stop offset="40%" stop-color="#FFC107"/>
      <stop offset="80%" stop-color="#FF8F00"/>
      <stop offset="100%" stop-color="#FF6F00"/>
    </linearGradient>

    <!-- Cyan Arc Glow Gradient -->
    <linearGradient id="arcCyan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#80F7FF"/>
      <stop offset="100%" stop-color="#00A3FF"/>
    </linearGradient>

    <!-- Neon Red Glow -->
    <filter id="neonRed" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="12" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Lens Hologram Glow -->
    <filter id="lensGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="blur2"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="16" result="blur3"/>
      <feMerge>
        <feMergeNode in="blur3"/>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="cyberGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#FF1A35" stroke-width="0.5" stroke-opacity="0.08"/>
      <circle cx="0" cy="0" r="1" fill="#FF1A35" fill-opacity="0.3"/>
    </pattern>
  </defs>

  <style>
    @keyframes radarSpin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes radarSpinRev {
      0% { transform: rotate(360deg); }
      100% { transform: rotate(0deg); }
    }
    @keyframes pulseSonar {
      0% { r: 15px; opacity: 0.9; stroke-width: 2.5px; }
      50% { r: 90px; opacity: 0.4; stroke-width: 1.5px; }
      100% { r: 165px; opacity: 0; stroke-width: 0.5px; }
    }
    @keyframes laserSweep {
      0% { transform: translateY(-70px); opacity: 0; }
      30% { opacity: 0.9; }
      70% { opacity: 0.9; }
      100% { transform: translateY(70px); opacity: 0; }
    }
    @keyframes eyeGaze {
      0%, 40%, 60%, 100% { transform: scaleY(1); }
      50% { transform: scaleY(0.2); }
    }
    @keyframes eqBar {
      0%, 100% { height: 6px; y: 22px; }
      50% { height: 26px; y: 2px; }
    }
    @keyframes textFlicker {
      0%, 100% { filter: drop-shadow(0 0 10px #FF1E38) drop-shadow(0 0 20px rgba(255,30,56,0.5)); }
      50% { filter: drop-shadow(0 0 18px #FF3B56) drop-shadow(0 0 30px #FFC107); }
    }
    @keyframes spiderTingle {
      0%, 100% { opacity: 0.3; transform: scale(0.95); }
      50% { opacity: 1; transform: scale(1.06); }
    }

    .sonar-1 { animation: pulseSonar 3s cubic-bezier(0.1, 0.7, 0.3, 1) infinite; transform-origin: 175px 180px; }
    .sonar-2 { animation: pulseSonar 3s cubic-bezier(0.1, 0.7, 0.3, 1) infinite 1s; transform-origin: 175px 180px; }
    .sonar-3 { animation: pulseSonar 3s cubic-bezier(0.1, 0.7, 0.3, 1) infinite 2s; transform-origin: 175px 180px; }

    .rot-reticle { animation: radarSpin 18s linear infinite; transform-origin: 175px 180px; }
    .rot-reticle-rev { animation: radarSpinRev 24s linear infinite; transform-origin: 175px 180px; }
    .rot-fast { animation: radarSpin 8s linear infinite; transform-origin: 175px 180px; }

    .laser-line { animation: laserSweep 3s ease-in-out infinite; }
    .mask-lens { animation: eyeGaze 4.5s ease-in-out infinite; transform-origin: 175px 175px; }
    .tingle-arcs { animation: spiderTingle 2s ease-in-out infinite; transform-origin: 175px 180px; }
    .hero-title { animation: textFlicker 3s ease-in-out infinite; }

    .eq-1 { animation: eqBar 0.9s ease-in-out infinite; }
    .eq-2 { animation: eqBar 1.2s ease-in-out infinite 0.2s; }
    .eq-3 { animation: eqBar 0.7s ease-in-out infinite 0.4s; }
    .eq-4 { animation: eqBar 1.4s ease-in-out infinite 0.1s; }
    .eq-5 { animation: eqBar 1.0s ease-in-out infinite 0.3s; }
  </style>

  <!-- Background Base -->
  <rect width="950" height="360" rx="16" fill="url(#bgGrad)"/>
  <rect width="950" height="360" rx="16" fill="url(#cyberGrid)"/>

  <!-- Tactical Hex / Web Matrix in Background -->
  <g stroke="#FF1E38" stroke-width="0.8" opacity="0.18" fill="none">
    <!-- Concentric 8-Sided Webs centered at (175, 180) -->
    <polygon points="175,80 245,110 275,180 245,250 175,280 105,250 75,180 105,110"/>
    <polygon points="175,40 275,80 315,180 275,280 175,320 75,280 35,180 75,80"/>
    <!-- Web Radials -->
    <line x1="175" y1="180" x2="175" y2="10"/>
    <line x1="175" y1="180" x2="330" y2="60"/>
    <line x1="175" y1="180" x2="350" y2="180"/>
    <line x1="175" y1="180" x2="330" y2="300"/>
    <line x1="175" y1="180" x2="175" y2="350"/>
    <line x1="175" y1="180" x2="20" y2="300"/>
    <line x1="175" y1="180" x2="5" y2="180"/>
    <line x1="175" y1="180" x2="20" y2="60"/>
  </g>

  <!-- Expanding Radar Sonar Waves -->
  <circle cx="175" cy="180" r="20" fill="none" stroke="#FF1E38" class="sonar-1"/>
  <circle cx="175" cy="180" r="20" fill="none" stroke="#00F0FF" class="sonar-2"/>
  <circle cx="175" cy="180" r="20" fill="none" stroke="#FFE57F" class="sonar-3"/>

  <!-- Rotating HUD Reticle Rings around Mask -->
  <g class="rot-reticle">
    <circle cx="175" cy="180" r="115" fill="none" stroke="#FF1E38" stroke-width="1.5" stroke-dasharray="12 8 4 8" opacity="0.6"/>
    <path d="M 175 60 L 175 52 M 175 300 L 175 308 M 55 180 L 47 180 M 295 180 L 303 180" stroke="#FFE57F" stroke-width="2.5"/>
    <circle cx="175" cy="65" r="3" fill="#00F0FF"/>
    <circle cx="175" cy="295" r="3" fill="#00F0FF"/>
  </g>

  <g class="rot-reticle-rev">
    <circle cx="175" cy="180" r="95" fill="none" stroke="#00F0FF" stroke-width="1.2" stroke-dasharray="24 12 6 12" opacity="0.5"/>
    <rect x="170" y="82" width="10" height="4" fill="#FF1E38"/>
    <rect x="170" y="274" width="10" height="4" fill="#FF1E38"/>
    <rect x="77" y="175" width="4" height="10" fill="#FF1E38"/>
    <rect x="269" y="175" width="4" height="10" fill="#FF1E38"/>
  </g>

  <!-- Spider-Sense Tingle Spark Arcs -->
  <g class="tingle-arcs" filter="url(#lensGlow)" stroke="#FFE57F" stroke-width="2.5" fill="none">
    <path d="M 130,85 Q 115,70 100,78 Q 90,58 75,65"/>
    <path d="M 150,60 Q 142,40 128,45 Q 120,22 105,30"/>
    <path d="M 175,45 Q 175,20 168,26 Q 170,5 158,12"/>
    <path d="M 200,60 Q 208,40 222,45 Q 230,22 245,30"/>
    <path d="M 220,85 Q 235,70 250,78 Q 260,58 275,65"/>
  </g>

  <!-- ============================================================== -->
  <!-- HIGH-END IRON SPIDER TACTICAL MASK (Multi-Layer Vector Armor)  -->
  <!-- ============================================================== -->
  <g filter="url(#neonRed)">
    <!-- Base Armor Plate -->
    <path d="M 175,90 C 220,90 248,125 244,175 C 240,220 210,256 175,268 C 140,256 110,220 106,175 C 102,125 130,90 175,90 Z"
          fill="url(#armorRed)" stroke="#FF3355" stroke-width="2.5"/>

    <!-- Gold Stark-Tech Brow & Jaw Armor Trim -->
    <path d="M 125,120 Q 175,100 225,120 L 232,135 Q 175,112 118,135 Z" fill="url(#starkGold)" opacity="0.85"/>
    <path d="M 140,240 Q 175,262 210,240 L 206,252 Q 175,270 144,252 Z" fill="url(#starkGold)" opacity="0.85"/>

    <!-- Cyber-Web Microgrooves & Carbon Fiber Weave -->
    <g stroke="#260007" stroke-width="1.5" fill="none">
      <path d="M 175,92 L 175,266"/>
      <path d="M 175,175 L 115,125 M 175,175 L 235,125"/>
      <path d="M 175,175 L 108,175 M 175,175 L 242,175"/>
      <path d="M 175,175 L 122,230 M 175,175 L 228,230"/>
      <!-- Concentric Webbing Segments -->
      <path d="M 142,132 Q 175,148 208,132"/>
      <path d="M 130,175 Q 175,198 220,175"/>
      <path d="M 140,220 Q 175,238 210,220"/>
    </g>
  </g>

  <!-- Glowing Titanium Holographic Eyes -->
  <g class="mask-lens" filter="url(#lensGlow)">
    <!-- Left Eye Outer Frame (Black Carbon + Gold Bezel) -->
    <path d="M 166,162 Q 155,144 125,152 Q 140,192 166,195 Q 172,178 166,162 Z" 
          fill="#080208" stroke="url(#starkGold)" stroke-width="2.5"/>
    <!-- Left Eye Holographic Core -->
    <path d="M 163,165 Q 154,150 130,156 Q 142,187 163,190 Z" 
          fill="#FFFFFF"/>
    <path d="M 130,156 Q 142,187 163,190 Q 150,185 140,172 Z" 
          fill="url(#arcCyan)" opacity="0.75"/>

    <!-- Right Eye Outer Frame (Black Carbon + Gold Bezel) -->
    <path d="M 184,162 Q 195,144 225,152 Q 210,192 184,195 Q 178,178 184,162 Z" 
          fill="#080208" stroke="url(#starkGold)" stroke-width="2.5"/>
    <!-- Right Eye Holographic Core -->
    <path d="M 187,165 Q 196,150 220,156 Q 208,187 187,190 Z" 
          fill="#FFFFFF"/>
    <path d="M 220,156 Q 208,187 187,190 Q 200,185 210,172 Z" 
          fill="url(#arcCyan)" opacity="0.75"/>
  </g>

  <!-- Cyan Laser Scan Bar -->
  <g class="laser-line" filter="url(#lensGlow)">
    <line x1="95" y1="180" x2="255" y2="180" stroke="#00F0FF" stroke-width="2" opacity="0.8"/>
  </g>

  <!-- ============================================================== -->
  <!-- RIGHT SIDE: STARK-TECH HUD TYPOGRAPHY & INTERACTIVE TELEMETRY  -->
  <!-- ============================================================== -->
  
  <!-- Top Ticker Bar -->
  <g transform="translate(360, 42)">
    <rect x="0" y="0" width="8" height="8" fill="#00F0FF"/>
    <text x="16" y="8" font-family="'SF Pro Display', 'Segoe UI', monospace" font-size="12" font-weight="700" fill="#00F0FF" letter-spacing="2">
      STARK-TECH HUD PROTOCOL v4.2 // ONLINE
    </text>

    <!-- Equalizer Spectrum Bars -->
    <g transform="translate(340, -12)" fill="#FF1E38">
      <rect x="0"  y="15" width="3" height="15" class="eq-1"/>
      <rect x="6"  y="10" width="3" height="20" class="eq-2"/>
      <rect x="12" y="5"  width="3" height="25" class="eq-3"/>
      <rect x="18" y="12" width="3" height="18" class="eq-4"/>
      <rect x="24" y="18" width="3" height="12" class="eq-5"/>
    </g>

    <rect x="420" y="-4" width="125" height="18" rx="4" fill="#200008" stroke="#FF1E38" stroke-width="1"/>
    <text x="432" y="9" font-family="monospace" font-size="10" font-weight="700" fill="#FFE57F">BEACON: 433.92MHz</text>
  </g>

  <!-- Main Headline Title with Neon Glow -->
  <g transform="translate(360, 115)" class="hero-title">
    <text x="0" y="0" font-family="'Segoe UI', -apple-system, 'Impact', sans-serif" font-size="56" font-weight="900" fill="#FFFFFF" letter-spacing="4">
      SPIDEY TRACKER
    </text>
  </g>

  <!-- Fun Subtitle / Tagline -->
  <text x="362" y="152" font-family="'Segoe UI', -apple-system, sans-serif" font-size="18" font-weight="700" fill="#FFE57F">
    🕷️ Built for fun, good vibes, &amp; tracking villains on a Saturday night.
  </text>

  <!-- 7 Interactive Badges in 2 Rows -->
  <!-- Row 1 -->
  <g transform="translate(362, 178)">
    <!-- Pill 1: Tracer -->
    <g transform="translate(0, 0)">
      <rect width="125" height="30" rx="6" fill="#18040C" stroke="#FF1E38" stroke-width="1.5"/>
      <text x="12" y="19" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="800" fill="#FFFFFF">🕷️ SPIDER-TRACER</text>
    </g>
    <!-- Pill 2: Spider-Sense -->
    <g transform="translate(135, 0)">
      <rect width="125" height="30" rx="6" fill="#18040C" stroke="#FFE57F" stroke-width="1.5"/>
      <text x="12" y="19" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="800" fill="#FFE57F">⚡ SPIDER-SENSE</text>
    </g>
    <!-- Pill 3: MCU Tracker -->
    <g transform="translate(270, 0)">
      <rect width="125" height="30" rx="6" fill="#18040C" stroke="#00F0FF" stroke-width="1.5"/>
      <text x="12" y="19" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="800" fill="#00F0FF">🎬 MCU TRACKER</text>
    </g>
    <!-- Pill 4: Web Shooter -->
    <g transform="translate(405, 0)">
      <rect width="125" height="30" rx="6" fill="#18040C" stroke="#00FF66" stroke-width="1.5"/>
      <text x="14" y="19" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="800" fill="#00FF66">🎮 WEB SHOOTER</text>
    </g>
  </g>

  <!-- Row 2: Secondary Specs -->
  <g transform="translate(362, 220)">
    <!-- Pill 5: Motion Radar -->
    <g transform="translate(0, 0)">
      <rect width="125" height="26" rx="5" fill="#100308" stroke="#FF1E38" stroke-width="1" opacity="0.85"/>
      <text x="12" y="17" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#FF4D66">🎯 MOTION RADAR</text>
    </g>
    <!-- Pill 6: Crash Sensor -->
    <g transform="translate(135, 0)">
      <rect width="125" height="26" rx="5" fill="#100308" stroke="#FF1E38" stroke-width="1" opacity="0.85"/>
      <text x="12" y="17" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#FF4D66">💥 CRASH SENSOR</text>
    </g>
    <!-- Pill 7: System Stats -->
    <g transform="translate(270, 0)">
      <rect width="125" height="26" rx="5" fill="#100308" stroke="#00F0FF" stroke-width="1" opacity="0.85"/>
      <text x="12" y="17" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#00F0FF">📊 S.H.I.E.L.D. STATS</text>
    </g>
    <!-- Pill 8: WiFi NTP -->
    <g transform="translate(405, 0)">
      <rect width="125" height="26" rx="5" fill="#100308" stroke="#FFE57F" stroke-width="1" opacity="0.85"/>
      <text x="14" y="17" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#FFE57F">📶 ATOMIC NTP</text>
    </g>
  </g>

  <!-- Bottom Coordinate Telemetry & Hero Quote -->
  <g transform="translate(362, 285)" font-family="monospace" font-size="12" fill="#788896">
    <text x="0" y="0">QUEENS, NYC // ESP32 DevKit V1 + 1.8&quot; ST7735 TFT + MPU6050 6-DOF IMU</text>
    <text x="0" y="20" fill="#FF1E38" font-weight="700">&gt; &quot;With great power comes great response time.&quot;</text>
  </g>

  <!-- Corner Brackets -->
  <g stroke="#FF1E38" stroke-width="2.5" fill="none">
    <path d="M 12 32 L 12 12 L 32 12"/>
    <path d="M 938 32 L 938 12 L 918 12"/>
    <path d="M 12 328 L 12 348 L 32 348"/>
    <path d="M 938 328 L 938 348 L 918 348"/>
  </g>
</svg>
