<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 450" width="100%" height="100%">
  <defs>
    <!-- Dark Minimalist Cyber Background Gradient -->
    <linearGradient id="hwBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04060E"/>
      <stop offset="45%" stop-color="#08030F"/>
      <stop offset="100%" stop-color="#0F0208"/>
    </linearGradient>

    <!-- Header Gradient -->
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="50%" stop-color="#FF1E38"/>
      <stop offset="100%" stop-color="#FFE57F"/>
    </linearGradient>

    <pattern id="hwGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#00F0FF" stroke-width="0.5" stroke-opacity="0.06"/>
      <circle cx="0" cy="0" r="0.6" fill="#00F0FF" fill-opacity="0.2"/>
    </pattern>

    <!-- Glowing Signal Filters -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="b1"/>
      <feMerge>
        <feMergeNode in="b1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="greenGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="b1"/>
      <feMerge>
        <feMergeNode in="b1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="redGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="b1"/>
      <feMerge>
        <feMergeNode in="b1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes pulseTrace {
      0% { stroke-dashoffset: 40; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes ledBluePulse {
      0%, 100% { fill: #00F0FF; filter: drop-shadow(0 0 6px #00F0FF); }
      50% { fill: #004466; filter: none; }
    }
    @keyframes ledGreenPulse {
      0%, 100% { fill: #004422; filter: none; }
      50% { fill: #00FF66; filter: drop-shadow(0 0 6px #00FF66); }
    }
    @keyframes ledRedPulse {
      0%, 40%, 60%, 100% { fill: #440008; filter: none; }
      50% { fill: #FF1E38; filter: drop-shadow(0 0 8px #FF1E38); }
    }

    .spi-bus  { stroke-dasharray: 8 4; animation: pulseTrace 1.4s linear infinite; }
    .i2c-bus  { stroke-dasharray: 8 4; animation: pulseTrace 1.8s linear infinite; }
    .ctrl-bus { stroke-dasharray: 6 3; animation: pulseTrace 2.2s linear infinite; }

    .led-b { animation: ledBluePulse 1.6s ease-in-out infinite; }
    .led-g { animation: ledGreenPulse 2.1s ease-in-out infinite; }
    .led-r { animation: ledRedPulse 3.0s ease-in-out infinite; }

    .label-title {
      font-family: 'Segoe UI', -apple-system, sans-serif;
      font-weight: 800;
      letter-spacing: 1px;
    }
    .mono-bold {
      font-family: 'SF Mono', Monaco, Consolas, monospace;
      font-weight: 700;
    }
  </style>

  <!-- Background Base Canvas -->
  <rect width="1020" height="450" rx="16" fill="url(#hwBg)" stroke="#180416" stroke-width="2"/>
  <rect width="1020" height="450" rx="16" fill="url(#hwGrid)"/>

  <!-- Top Banner Title Bar -->
  <g transform="translate(20, 20)">
    <rect width="980" height="38" rx="8" fill="#120416" stroke="#FF1E38" stroke-width="1.2"/>
    <rect x="0" y="0" width="6" height="38" rx="3" fill="url(#headerGrad)"/>
    <text x="20" y="24" class="label-title" font-size="14" fill="#FFFFFF" letter-spacing="2">
      🛠️ HARDWARE WIRING &amp; PINOUT DIRECTORY
    </text>
    <rect x="810" y="8" width="155" height="22" rx="4" fill="#1C0824" stroke="#00F0FF" stroke-width="1"/>
    <text x="822" y="23" font-family="monospace" font-size="11" font-weight="700" fill="#00F0FF">
      3.3V / 5V DC RAIL
    </text>
  </g>

  <!-- ============================================================== -->
  <!-- 1. LEFT CARD: ST7735 1.8" SPI TFT DISPLAY                      -->
  <!-- ============================================================== -->
  <g transform="translate(25, 75)">
    <!-- Card Frame -->
    <rect width="280" height="270" rx="10" fill="#050C16" stroke="#00F0FF" stroke-width="1.8"/>
    
    <!-- Header -->
    <rect x="0" y="0" width="280" height="36" rx="9" fill="#0A1A2E" stroke="#00F0FF" stroke-width="1"/>
    <text x="14" y="23" class="label-title" font-size="13" fill="#00F0FF">📺 ST7735 1.8&quot; SPI TFT</text>
    <text x="205" y="23" class="mono-bold" font-size="11" fill="#A0C0E0">128×160</text>

    <!-- Screen Preview -->
    <rect x="15" y="48" width="105" height="135" rx="5" fill="#020408" stroke="#004466" stroke-width="1"/>
    <circle cx="67" cy="115" r="28" fill="none" stroke="#FF1E38" stroke-width="1.2"/>
    <circle cx="67" cy="115" r="16" fill="none" stroke="#FFE57F" stroke-width="0.8"/>
    <line x1="39" y1="115" x2="95" y2="115" stroke="#330008"/>
    <line x1="67" y1="87" x2="67" y2="143" stroke="#330008"/>
    <text x="25" y="70" class="mono-bold" font-size="7.5" fill="#00F0FF">SPIDEY TRACKER</text>
    <text x="46" y="172" class="mono-bold" font-size="8" fill="#00FF66">128×160</text>

    <!-- Highly Legible Pin Mapping Table -->
    <g transform="translate(130, 48)">
      <!-- Pin Row 1 -->
      <g transform="translate(0, 0)">
        <rect width="45" height="22" rx="4" fill="#002238" stroke="#00F0FF" stroke-width="1"/>
        <text x="12" y="15" class="mono-bold" font-size="11" fill="#FFFFFF">CS</text>
        <text x="52" y="15" class="mono-bold" font-size="11" fill="#00F0FF">➜ GPIO 5</text>
      </g>
      <!-- Pin Row 2 -->
      <g transform="translate(0, 26)">
        <rect width="45" height="22" rx="4" fill="#002238" stroke="#00F0FF" stroke-width="1"/>
        <text x="8" y="15" class="mono-bold" font-size="11" fill="#FFFFFF">RST</text>
        <text x="52" y="15" class="mono-bold" font-size="11" fill="#00F0FF">➜ GPIO 4</text>
      </g>
      <!-- Pin Row 3 -->
      <g transform="translate(0, 52)">
        <rect width="45" height="22" rx="4" fill="#002238" stroke="#00F0FF" stroke-width="1"/>
        <text x="12" y="15" class="mono-bold" font-size="11" fill="#FFFFFF">DC</text>
        <text x="52" y="15" class="mono-bold" font-size="11" fill="#00F0FF">➜ GPIO 2</text>
      </g>
      <!-- Pin Row 4 -->
      <g transform="translate(0, 78)">
        <rect width="45" height="22" rx="4" fill="#002238" stroke="#00F0FF" stroke-width="1"/>
        <text x="6" y="15" class="mono-bold" font-size="10" fill="#FFFFFF">MOSI</text>
        <text x="52" y="15" class="mono-bold" font-size="11" fill="#00F0FF">➜ GPIO 23</text>
      </g>
      <!-- Pin Row 5 -->
      <g transform="translate(0, 104)">
        <rect width="45" height="22" rx="4" fill="#002238" stroke="#00F0FF" stroke-width="1"/>
        <text x="10" y="15" class="mono-bold" font-size="10.5" fill="#FFFFFF">SCK</text>
        <text x="52" y="15" class="mono-bold" font-size="11" fill="#00F0FF">➜ GPIO 18</text>
      </g>
      <!-- Pin Row 6 -->
      <g transform="translate(0, 130)">
        <rect width="45" height="22" rx="4" fill="#002238" stroke="#FFE57F" stroke-width="1"/>
        <text x="8" y="15" class="mono-bold" font-size="10.5" fill="#FFE57F">VCC</text>
        <text x="52" y="15" class="mono-bold" font-size="11" fill="#FFE57F">➜ 3.3V / 5V</text>
      </g>
    </g>

    <!-- Bottom Feature Tag -->
    <rect x="15" y="235" width="250" height="24" rx="4" fill="#081824"/>
    <text x="24" y="251" class="mono-bold" font-size="10" fill="#00F0FF">BUS: Hardware SPI @ 27MHz</text>
  </g>

  <!-- Animated SPI Data Bus Lines (Left Screen to Center ESP32) -->
  <g stroke="#00F0FF" stroke-width="2.2" fill="none" class="spi-bus" filter="url(#cyanGlow)">
    <path d="M 305,150 L 375,150"/>
    <path d="M 305,176 L 375,176"/>
    <path d="M 305,202 L 375,202"/>
    <path d="M 305,228 L 375,228"/>
  </g>

  <!-- ============================================================== -->
  <!-- 2. CENTER CARD: ESP32 DEVKIT V1 (MASTER CONTROLLER)            -->
  <!-- ============================================================== -->
  <g transform="translate(375, 75)">
    <!-- ESP32 Module Box -->
    <rect width="270" height="270" rx="10" fill="#0C0412" stroke="#FF1E38" stroke-width="2"/>

    <!-- Header -->
    <rect x="0" y="0" width="270" height="36" rx="9" fill="#24050E" stroke="#FF1E38" stroke-width="1"/>
    <text x="14" y="23" class="label-title" font-size="13" fill="#FFFFFF">🧠 ESP32 DEVKIT V1</text>
    <text x="200" y="23" class="mono-bold" font-size="11" fill="#FF4D66">30-PIN</text>

    <!-- Center SoC Metal Shield -->
    <rect x="25" y="48" width="220" height="120" rx="6" fill="#1A0618" stroke="#FFE57F" stroke-width="1.4"/>
    <text x="52" y="80" class="label-title" font-size="16" fill="#FFFFFF">ESP-WROOM-32</text>
    <text x="46" y="105" class="mono-bold" font-size="12" fill="#00F0FF">240MHz DUAL-CORE</text>
    <text x="56" y="128" class="mono-bold" font-size="11" fill="#FFE57F">Wi-Fi + BLE + 4MB</text>
    <circle cx="135" cy="148" r="7" fill="#FF1E38" filter="url(#redGlow)"/>

    <!-- Bottom Specs Grid -->
    <g transform="translate(18, 180)">
      <rect width="112" height="36" rx="5" fill="#180410" stroke="#FF1E38" stroke-width="1"/>
      <text x="10" y="15" class="mono-bold" font-size="9" fill="#FF4D66">POWER INPUT</text>
      <text x="10" y="30" class="mono-bold" font-size="11" fill="#FFFFFF">5V USB / VIN</text>

      <rect x="122" y="0" width="112" height="36" rx="5" fill="#180410" stroke="#00FF66" stroke-width="1"/>
      <text x="10" y="15" class="mono-bold" font-size="9" fill="#00FF66">LOGIC LEVEL</text>
      <text x="10" y="30" class="mono-bold" font-size="11" fill="#FFFFFF">3.3V (LVTTL)</text>
    </g>

    <!-- Bottom Protocol Bar -->
    <rect x="18" y="225" width="234" height="26" rx="5" fill="#180414" stroke="#FFE57F" stroke-width="1"/>
    <text x="28" y="242" class="mono-bold" font-size="10.5" fill="#FFE57F">NTP TIME SYNC: ON (WiFi)</text>
  </g>

  <!-- Animated I2C Bus Lines (ESP32 to MPU6050) -->
  <g stroke="#00FF66" stroke-width="2.2" fill="none" class="i2c-bus" filter="url(#greenGlow)">
    <path d="M 645,135 L 710,135"/>
    <path d="M 645,155 L 710,155"/>
  </g>

  <!-- Animated Control Lines (ESP32 to Buttons & LEDs) -->
  <g stroke="#FF1E38" stroke-width="2.2" fill="none" class="ctrl-bus" filter="url(#redGlow)">
    <path d="M 645,245 L 710,245"/>
    <path d="M 645,275 L 710,275"/>
  </g>

  <!-- ============================================================== -->
  <!-- 3. TOP-RIGHT CARD: MPU6050 6-DOF IMU (I2C)                     -->
  <!-- ============================================================== -->
  <g transform="translate(710, 75)">
    <!-- Card Frame -->
    <rect width="285" height="125" rx="10" fill="#02140A" stroke="#00FF66" stroke-width="1.8"/>

    <!-- Header -->
    <rect x="0" y="0" width="285" height="34" rx="9" fill="#052414" stroke="#00FF66" stroke-width="1"/>
    <text x="14" y="22" class="label-title" font-size="13" fill="#00FF66">🧭 MPU6050 6-DOF IMU</text>
    <text x="210" y="22" class="mono-bold" font-size="11" fill="#A0E0B0">I2C BUS</text>

    <!-- High Legibility Pin Badges -->
    <g transform="translate(14, 45)">
      <!-- Row 1 -->
      <g transform="translate(0, 0)">
        <rect width="48" height="24" rx="4" fill="#002E16" stroke="#00FF66" stroke-width="1"/>
        <text x="10" y="16" class="mono-bold" font-size="11" fill="#FFFFFF">SDA</text>
        <text x="56" y="17" class="mono-bold" font-size="12" fill="#00FF66">➜ GPIO 21</text>
      </g>
      <g transform="translate(135, 0)">
        <rect width="48" height="24" rx="4" fill="#002E16" stroke="#00FF66" stroke-width="1"/>
        <text x="10" y="16" class="mono-bold" font-size="11" fill="#FFFFFF">SCL</text>
        <text x="56" y="17" class="mono-bold" font-size="12" fill="#00FF66">➜ GPIO 22</text>
      </g>

      <!-- Row 2 -->
      <g transform="translate(0, 34)">
        <rect width="48" height="24" rx="4" fill="#002E16" stroke="#FFE57F" stroke-width="1"/>
        <text x="10" y="16" class="mono-bold" font-size="11" fill="#FFE57F">VCC</text>
        <text x="56" y="17" class="mono-bold" font-size="12" fill="#FFE57F">➜ VIN / 5V</text>
      </g>
      <g transform="translate(135, 34)">
        <rect width="48" height="24" rx="4" fill="#002E16" stroke="#A0C0E0" stroke-width="1"/>
        <text x="6" y="16" class="mono-bold" font-size="10.5" fill="#A0C0E0">ADDR</text>
        <text x="56" y="17" class="mono-bold" font-size="12" fill="#A0C0E0">➜ 0x68</text>
      </g>
    </g>
  </g>

  <!-- ============================================================== -->
  <!-- 4. BOTTOM-RIGHT CARD: BUTTONS & STATUS LEDS                    -->
  <!-- ============================================================== -->
  <g transform="translate(710, 212)">
    <!-- Card Frame -->
    <rect width="285" height="133" rx="10" fill="#14040A" stroke="#FF1E38" stroke-width="1.8"/>

    <!-- Header -->
    <rect x="0" y="0" width="285" height="34" rx="9" fill="#24040E" stroke="#FF1E38" stroke-width="1"/>
    <text x="14" y="22" class="label-title" font-size="13" fill="#FFFFFF">🎮 BUTTONS &amp; STATUS LEDS</text>

    <!-- 3 Glowing LEDs Row -->
    <g transform="translate(15, 46)">
      <!-- Blue LED -->
      <g transform="translate(0, 0)">
        <circle cx="12" cy="12" r="9" class="led-b"/>
        <text x="26" y="16" class="mono-bold" font-size="11" fill="#00F0FF">D12 (BLUE)</text>
      </g>
      <!-- Green LED -->
      <g transform="translate(100, 0)">
        <circle cx="12" cy="12" r="9" class="led-g"/>
        <text x="26" y="16" class="mono-bold" font-size="11" fill="#00FF66">D14 (GREEN)</text>
      </g>
      <!-- Red LED -->
      <g transform="translate(195, 0)">
        <circle cx="12" cy="12" r="9" class="led-r"/>
        <text x="26" y="16" class="mono-bold" font-size="11" fill="#FF1E38">D27 (RED)</text>
      </g>
    </g>

    <!-- 3 Tactile Buttons Row -->
    <g transform="translate(15, 80)">
      <!-- UP Button -->
      <g transform="translate(0, 0)">
        <rect width="80" height="34" rx="5" fill="#200008" stroke="#FFE57F" stroke-width="1.2"/>
        <text x="8" y="22" class="mono-bold" font-size="13" fill="#FFE57F">▲</text>
        <text x="26" y="22" class="mono-bold" font-size="11.5" fill="#FFFFFF">D25</text>
      </g>
      <!-- SELECT Button -->
      <g transform="translate(90, 0)">
        <rect width="80" height="34" rx="5" fill="#200008" stroke="#00F0FF" stroke-width="1.2"/>
        <text x="8" y="22" class="mono-bold" font-size="13" fill="#00F0FF">●</text>
        <text x="26" y="22" class="mono-bold" font-size="11.5" fill="#FFFFFF">D26</text>
      </g>
      <!-- DOWN Button -->
      <g transform="translate(180, 0)">
        <rect width="80" height="34" rx="5" fill="#200008" stroke="#FFE57F" stroke-width="1.2"/>
        <text x="8" y="22" class="mono-bold" font-size="13" fill="#FFE57F">▼</text>
        <text x="26" y="22" class="mono-bold" font-size="11.5" fill="#FFFFFF">D33</text>
      </g>
    </g>

    <text x="16" y="125" class="mono-bold" font-size="9" fill="#788896">INTERNAL PULLUP // 50ms DEBOUNCE</text>
  </g>

  <!-- ============================================================== -->
  <!-- BOTTOM: QUICKSTART ONE-LINER FLASH BANNER                      -->
  <!-- ============================================================== -->
  <g transform="translate(20, 360)">
    <rect width="980" height="68" rx="8" fill="#090212" stroke="#250524" stroke-width="1.4"/>
    <text x="20" y="26" class="label-title" font-size="13" fill="#FFE57F">
      ⚡ FLASH FIRMWARE IN 1-COMMAND (PLATFORMIO)
    </text>
    <text x="20" y="50" class="mono-bold" font-size="12.5" fill="#00F0FF">
      git clone https://github.com/Eurt-labs/Spidey-tracker.git &amp;&amp; cd Spidey-tracker &amp;&amp; pio run -t upload
    </text>
    <rect x="830" y="18" width="135" height="30" rx="6" fill="#042012" stroke="#00FF66" stroke-width="1.2"/>
    <text x="846" y="38" class="mono-bold" font-size="11" fill="#00FF66">
      ✓ BUILD &lt; 10s
    </text>
  </g>

  <!-- Corner Brackets -->
  <g stroke="#FF1E38" stroke-width="2.5" fill="none">
    <path d="M 12 32 L 12 12 L 32 12"/>
    <path d="M 1008 32 L 1008 12 L 988 12"/>
    <path d="M 12 418 L 12 438 L 32 438"/>
    <path d="M 1008 418 L 1008 438 L 988 438"/>
  </g>
</svg>
