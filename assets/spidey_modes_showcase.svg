<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 560" width="100%" height="100%">
  <defs>
    <!-- Card Dark Gradient -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10030A"/>
      <stop offset="100%" stop-color="#040108"/>
    </linearGradient>

    <!-- Header Gradient -->
    <linearGradient id="secHeadGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF1E38"/>
      <stop offset="100%" stop-color="#800010"/>
    </linearGradient>

    <!-- Gold Accent -->
    <linearGradient id="goldAcc" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFE57F"/>
      <stop offset="100%" stop-color="#FF9100"/>
    </linearGradient>

    <filter id="cardGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="b1"/>
      <feMerge>
        <feMergeNode in="b1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes sweepLine {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes blipBlink {
      0%, 100% { opacity: 0.3; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.3); }
    }
    @keyframes alertStrobe {
      0%, 100% { fill: #10030A; }
      50% { fill: #38000C; }
    }
    @keyframes irisSquint {
      0%, 40%, 60%, 100% { transform: scaleY(1); }
      50% { transform: scaleY(0.2); }
    }
    @keyframes laserAim {
      0% { transform: translate(0, 0); }
      25% { transform: translate(12px, -8px); }
      50% { transform: translate(-10px, 10px); }
      75% { transform: translate(8px, 6px); }
      100% { transform: translate(0, 0); }
    }
    @keyframes clockTick {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    @keyframes graphScroll {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: 60; }
    }

    .radar-rot { animation: sweepLine 3.5s linear infinite; transform-origin: 55px 55px; }
    .blip-pulse { animation: blipBlink 1.4s ease-in-out infinite; transform-origin: 65px 42px; }
    .crash-strobe { animation: alertStrobe 1.2s ease-in-out infinite; }
    .lens-motion { animation: irisSquint 3.8s ease-in-out infinite; transform-origin: 55px 52px; }
    .crosshair-move { animation: laserAim 4s ease-in-out infinite; transform-origin: 55px 55px; }
    .colon-blink { animation: clockTick 1s steps(1) infinite; }
    .live-wave { stroke-dasharray: 6 3; animation: graphScroll 1.5s linear infinite; }

    .hud-title {
      font-family: 'Segoe UI', -apple-system, sans-serif;
      font-weight: 900;
      letter-spacing: 1.5px;
    }
    .hud-desc {
      font-family: 'Segoe UI', -apple-system, sans-serif;
      font-size: 11.5px;
      fill: #A0B0C0;
      line-height: 16px;
    }
  </style>

  <!-- Background Base -->
  <rect width="950" height="560" rx="16" fill="#060108" stroke="#1A040E" stroke-width="2"/>

  <!-- Section Top Banner -->
  <g transform="translate(20, 20)">
    <rect width="910" height="34" rx="6" fill="url(#secHeadGrad)"/>
    <text x="16" y="23" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="900" fill="#FFFFFF" letter-spacing="3">
      ⚡ TACTICAL SUIT MODES // 7 EMBEDDED SYSTEMS
    </text>
    <text x="740" y="22" font-family="monospace" font-size="11" font-weight="700" fill="#FFE57F">
      SYSTEM STATUS: ARMED
    </text>
  </g>

  <!-- ============================================================== -->
  <!-- ROW 1 (Cards 1, 2, 3)                                          -->
  <!-- ============================================================== -->

  <!-- CARD 1: SPIDER-TRACER (X: 20, Y: 70) -->
  <g transform="translate(20, 70)">
    <rect width="290" height="145" rx="10" fill="url(#cardBg)" stroke="#FF1E38" stroke-width="1.2"/>
    <!-- Card Header -->
    <rect x="0" y="0" width="290" height="24" rx="10" fill="#20000A"/>
    <text x="12" y="16" font-size="11" fill="#FF1E38" class="hud-title">01 // 🕷️ SPIDER-TRACER</text>
    <text x="215" y="16" font-family="monospace" font-size="9" fill="#00F0FF">BEARING: 042°</text>

    <!-- Left Radar Graphic -->
    <g transform="translate(10, 30)">
      <circle cx="55" cy="55" r="42" fill="#050106" stroke="#280008" stroke-width="1.5"/>
      <circle cx="55" cy="55" r="28" fill="none" stroke="#280008" stroke-width="1"/>
      <circle cx="55" cy="55" r="14" fill="none" stroke="#280008" stroke-width="1"/>
      <line x1="13" y1="55" x2="97" y2="55" stroke="#280008" stroke-width="1"/>
      <line x1="55" y1="13" x2="55" y2="97" stroke="#280008" stroke-width="1"/>
      
      <!-- Sweep Line -->
      <g class="radar-rot">
        <line x1="55" y1="55" x2="95" y2="55" stroke="#FF1E38" stroke-width="2"/>
      </g>
      <!-- Target Blip -->
      <circle cx="65" cy="42" r="4" fill="#FFE57F" class="blip-pulse" filter="url(#cardGlow)"/>
      <rect x="60" y="37" width="10" height="10" fill="none" stroke="#FF1E38" stroke-width="1"/>
      <!-- Origin -->
      <circle cx="55" cy="55" r="2.5" fill="#00F0FF"/>
    </g>

    <!-- Right Info -->
    <g transform="translate(125, 42)">
      <text x="0" y="0" font-size="12" font-weight="700" fill="#FFFFFF">Movie Gadget Locator</text>
      <text x="0" y="18" class="hud-desc">Rotate ESP32 to steer</text>
      <text x="0" y="32" class="hud-desc">toward target bearing.</text>
      <text x="0" y="46" class="hud-desc">Signal peaks to 99%!</text>
      <rect x="0" y="56" width="150" height="16" rx="3" fill="#180006" stroke="#FF1E38" stroke-width="0.8"/>
      <text x="8" y="68" font-family="monospace" font-size="9" fill="#FFE57F">LOCK: [ VULTURE ] 142m</text>
    </g>
  </g>

  <!-- CARD 2: MOTION RADAR (X: 330, Y: 70) -->
  <g transform="translate(330, 70)">
    <rect width="290" height="145" rx="10" fill="url(#cardBg)" stroke="#FF1E38" stroke-width="1.2"/>
    <rect x="0" y="0" width="290" height="24" rx="10" fill="#20000A"/>
    <text x="12" y="16" font-size="11" fill="#FF1E38" class="hud-title">02 // 🎯 MOTION RADAR</text>
    <text x="210" y="16" font-family="monospace" font-size="9" fill="#FFE57F">6-DOF // 100Hz</text>

    <!-- Web Radar Graphic -->
    <g transform="translate(10, 30)">
      <polygon points="55,15 88,27 95,55 88,83 55,95 22,83 15,55 22,27" fill="#050106" stroke="#FF1E38" stroke-width="1" opacity="0.6"/>
      <polygon points="55,30 75,38 80,55 75,72 55,80 35,72 30,55 35,38" fill="none" stroke="#280008" stroke-width="1"/>
      <line x1="55" y1="55" x2="78" y2="35" stroke="#FF1E38" stroke-width="2.5"/>
      <circle cx="78" cy="35" r="4" fill="#00F0FF" filter="url(#cardGlow)"/>
      <circle cx="55" cy="55" r="2.5" fill="#FFE57F"/>
    </g>

    <!-- Right Info -->
    <g transform="translate(125, 42)">
      <text x="0" y="0" font-size="12" font-weight="700" fill="#FFFFFF">6-DOF Attitude Web</text>
      <text x="0" y="18" class="hud-desc">Tracks real-time pitch,</text>
      <text x="0" y="32" class="hud-desc">roll, and tilt vector</text>
      <text x="0" y="46" class="hud-desc">with dual PWM LED glow.</text>
      <rect x="0" y="56" width="150" height="16" rx="3" fill="#001820" stroke="#00F0FF" stroke-width="0.8"/>
      <text x="8" y="68" font-family="monospace" font-size="9" fill="#00F0FF">aX:+1.2 aY:-0.8 G:1.0</text>
    </g>
  </g>

  <!-- CARD 3: CRASH SENSOR (X: 640, Y: 70) -->
  <g transform="translate(640, 70)">
    <rect width="290" height="145" rx="10" class="crash-strobe" stroke="#FF1E38" stroke-width="1.2"/>
    <rect x="0" y="0" width="290" height="24" rx="10" fill="#20000A"/>
    <text x="12" y="16" font-size="11" fill="#FF1E38" class="hud-title">03 // 💥 CRASH SENSOR</text>
    <text x="215" y="16" font-family="monospace" font-size="9" fill="#FF1E38">TRIG: 15G</text>

    <!-- Strain Wave Graphic -->
    <g transform="translate(10, 30)">
      <rect width="100" height="85" fill="#080104" rx="6" stroke="#38000A" stroke-width="1"/>
      <path d="M 5,60 L 25,60 L 35,20 L 45,75 L 55,30 L 65,65 L 75,55 L 95,60" fill="none" stroke="#FF1E38" stroke-width="2" class="live-wave"/>
      <line x1="5" y1="25" x2="95" y2="25" stroke="#FFE57F" stroke-width="1" stroke-dasharray="3 2"/>
      <text x="50" y="20" font-family="monospace" font-size="8" fill="#FFE57F">15G PEAK</text>
    </g>

    <!-- Right Info -->
    <g transform="translate(125, 42)">
      <text x="0" y="0" font-size="12" font-weight="700" fill="#FFFFFF">High-G Impact Meter</text>
      <text x="0" y="18" class="hud-desc">Logs 4-event impact</text>
      <text x="0" y="32" class="hud-desc">history with timestamps.</text>
      <text x="0" y="46" class="hud-desc">Full-screen strobe alert!</text>
      <rect x="0" y="56" width="150" height="16" rx="3" fill="#200008" stroke="#FF1E38" stroke-width="0.8"/>
      <text x="8" y="68" font-family="monospace" font-size="9" fill="#FF3355">IMPACT: 18.4G [LOGGED]</text>
    </g>
  </g>

  <!-- ============================================================== -->
  <!-- ROW 2 (Cards 4, 5, 6)                                          -->
  <!-- ============================================================== -->

  <!-- CARD 4: SPIDER-SENSE (X: 20, Y: 230) -->
  <g transform="translate(20, 230)">
    <rect width="290" height="145" rx="10" fill="url(#cardBg)" stroke="#FFE57F" stroke-width="1.2"/>
    <rect x="0" y="0" width="290" height="24" rx="10" fill="#201800"/>
    <text x="12" y="16" font-size="11" fill="#FFE57F" class="hud-title">04 // ⚡ SPIDER-SENSE</text>
    <text x="215" y="16" font-family="monospace" font-size="9" fill="#FFE57F">IRIS: AUTO</text>

    <!-- Dynamic Mask Eye Graphic -->
    <g transform="translate(10, 30)">
      <rect width="100" height="85" fill="#080104" rx="6" stroke="#382800" stroke-width="1"/>
      <g class="lens-motion" filter="url(#cardGlow)">
        <!-- Tactical Mask Lens -->
        <path d="M 50,25 Q 75,32 85,55 Q 60,75 50,70 Q 25,65 15,55 Q 25,32 50,25 Z" fill="#080208" stroke="#FFE57F" stroke-width="2"/>
        <path d="M 50,30 Q 70,36 78,55 Q 58,68 50,65 Q 30,62 22,55 Q 30,36 50,30 Z" fill="#FFFFFF"/>
      </g>
      <text x="26" y="80" font-family="monospace" font-size="8" fill="#FFE57F">! THREAT ALERT !</text>
    </g>

    <!-- Right Info -->
    <g transform="translate(125, 42)">
      <text x="0" y="0" font-size="12" font-weight="700" fill="#FFFFFF">Threat Perception HUD</text>
      <text x="0" y="18" class="hud-desc">Senses subtle vibrations</text>
      <text x="0" y="32" class="hud-desc">and acceleration spikes.</text>
      <text x="0" y="46" class="hud-desc">Eyes dilate wide on alert.</text>
      <rect x="0" y="56" width="150" height="16" rx="3" fill="#181400" stroke="#FFE57F" stroke-width="0.8"/>
      <text x="8" y="68" font-family="monospace" font-size="9" fill="#FFE57F">DELTA: +4.2G // SENSE OK</text>
    </g>
  </g>

  <!-- CARD 5: MARVEL CINEMA (X: 330, Y: 230) -->
  <g transform="translate(330, 230)">
    <rect width="290" height="145" rx="10" fill="url(#cardBg)" stroke="#00F0FF" stroke-width="1.2"/>
    <rect x="0" y="0" width="290" height="24" rx="10" fill="#001824"/>
    <text x="12" y="16" font-size="11" fill="#00F0FF" class="hud-title">05 // 🎬 MARVEL CINEMA</text>
    <text x="215" y="16" font-family="monospace" font-size="9" fill="#00FF66">NTP: SYNCED</text>

    <!-- Clock / Countdown Graphic -->
    <g transform="translate(10, 30)">
      <rect width="100" height="85" fill="#020810" rx="6" stroke="#003848" stroke-width="1"/>
      <text x="10" y="24" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="700" fill="#FF1E38">DOOMSDAY</text>
      <text x="10" y="44" font-family="monospace" font-size="14" font-weight="900" fill="#FFFFFF">488</text>
      <text x="45" y="44" font-family="monospace" font-size="9" fill="#FFE57F">DAYS</text>
      <g font-family="monospace" font-size="10" fill="#00F0FF">
        <text x="10" y="66">14<tspan class="colon-blink">:</tspan>32<tspan class="colon-blink">:</tspan>08</text>
      </g>
    </g>

    <!-- Right Info -->
    <g transform="translate(125, 42)">
      <text x="0" y="0" font-size="12" font-weight="700" fill="#FFFFFF">WiFi Atomic Timeline</text>
      <text x="0" y="18" class="hud-desc">Syncs with global NTP.</text>
      <text x="0" y="32" class="hud-desc">Live countdowns &amp; elapsed</text>
      <text x="0" y="46" class="hud-desc">days since MCU premieres!</text>
      <rect x="0" y="56" width="150" height="16" rx="3" fill="#001820" stroke="#00F0FF" stroke-width="0.8"/>
      <text x="8" y="68" font-family="monospace" font-size="9" fill="#00F0FF">DOOMSDAY: 18 DEC 2026</text>
    </g>
  </g>

  <!-- CARD 6: WEB TARGETING (X: 640, Y: 230) -->
  <g transform="translate(640, 230)">
    <rect width="290" height="145" rx="10" fill="url(#cardBg)" stroke="#00FF66" stroke-width="1.2"/>
    <rect x="0" y="0" width="290" height="24" rx="10" fill="#002010"/>
    <text x="12" y="16" font-size="11" fill="#00FF66" class="hud-title">06 // 🎮 WEB TARGETING</text>
    <text x="220" y="16" font-family="monospace" font-size="9" fill="#FFE57F">COMBO: x3</text>

    <!-- Laser Arena Graphic -->
    <g transform="translate(10, 30)">
      <rect width="100" height="85" fill="#020C06" rx="6" stroke="#00381C" stroke-width="1"/>
      <g class="crosshair-move">
        <circle cx="50" cy="45" r="14" fill="none" stroke="#00FF66" stroke-width="1.5"/>
        <line x1="32" y1="45" x2="68" y2="45" stroke="#00FF66" stroke-width="1.5"/>
        <line x1="50" y1="27" x2="50" y2="63" stroke="#00FF66" stroke-width="1.5"/>
        <circle cx="50" cy="45" r="2" fill="#FF1E38"/>
      </g>
      <!-- Drone Target -->
      <circle cx="70" cy="30" r="5" fill="#FF1E38" opacity="0.8"/>
      <!-- Web Trace -->
      <line x1="50" y1="85" x2="50" y2="45" stroke="#FFFFFF" stroke-width="1.5" stroke-dasharray="4 2"/>
    </g>

    <!-- Right Info -->
    <g transform="translate(125, 42)">
      <text x="0" y="0" font-size="12" font-weight="700" fill="#FFFFFF">Tilt-Aimed Shooter</text>
      <text x="0" y="18" class="hud-desc">Tilt board to steer laser,</text>
      <text x="0" y="32" class="hud-desc">tap SELECT to fire webs!</text>
      <text x="0" y="46" class="hud-desc">Combos &amp; explosions.</text>
      <rect x="0" y="56" width="150" height="16" rx="3" fill="#002010" stroke="#00FF66" stroke-width="0.8"/>
      <text x="8" y="68" font-family="monospace" font-size="9" fill="#00FF66">SCORE: 1,450 [x3 MULTI]</text>
    </g>
  </g>

  <!-- ============================================================== -->
  <!-- ROW 3 (Card 7: S.H.I.E.L.D. System Widecard)                   -->
  <!-- ============================================================== -->
  <g transform="translate(20, 390)">
    <rect width="910" height="145" rx="10" fill="url(#cardBg)" stroke="#00F0FF" stroke-width="1.2"/>
    <rect x="0" y="0" width="910" height="24" rx="10" fill="#001824"/>
    <text x="16" y="16" font-size="11" fill="#00F0FF" class="hud-title">07 // 📊 S.H.I.E.L.D. SYSTEM DIAGNOSTICS &amp; TELEMETRY TERMINAL</text>
    <text x="760" y="16" font-family="monospace" font-size="9" fill="#FFE57F">BUS: I2C (100kHz) + SPI (27MHz)</text>

    <!-- Telemetry Column 1: IMU Live Wave -->
    <g transform="translate(20, 35)">
      <rect width="260" height="90" fill="#020812" rx="6" stroke="#002C38" stroke-width="1"/>
      <text x="10" y="18" font-family="monospace" font-size="10" font-weight="700" fill="#00F0FF">IMU ATTITUDE WAVEFORM</text>
      <path d="M 10,50 Q 40,25 70,50 T 130,50 T 190,50 T 250,50" fill="none" stroke="#FF1E38" stroke-width="1.8" class="live-wave"/>
      <path d="M 10,65 Q 40,75 70,65 T 130,65 T 190,65 T 250,65" fill="none" stroke="#00F0FF" stroke-width="1.5" class="live-wave"/>
      <text x="10" y="82" font-family="monospace" font-size="8" fill="#FFE57F">X: +0.42g  Y: -0.15g  Z: +0.98g</text>
    </g>

    <!-- Telemetry Column 2: System Specs -->
    <g transform="translate(310, 35)">
      <rect width="280" height="90" fill="#020812" rx="6" stroke="#002C38" stroke-width="1"/>
      <text x="10" y="18" font-family="monospace" font-size="10" font-weight="700" fill="#FFE57F">ESP32 CORE TELEMETRY</text>
      <text x="10" y="38" font-family="monospace" font-size="10" fill="#FFFFFF">• CPU: Dual-Core Xtensa @ 240MHz</text>
      <text x="10" y="54" font-family="monospace" font-size="10" fill="#FFFFFF">• FREE HEAP: 281,344 BYTES (86%)</text>
      <text x="10" y="70" font-family="monospace" font-size="10" fill="#FFFFFF">• CHIP IDENT: MPU6050 (0x68 OK)</text>
      <text x="10" y="84" font-family="monospace" font-size="9" fill="#00FF66">• STATUS: ALL SUBSYSTEMS NOMINAL</text>
    </g>

    <!-- Telemetry Column 3: Quick Navigation -->
    <g transform="translate(620, 35)">
      <rect width="270" height="90" fill="#020812" rx="6" stroke="#002C38" stroke-width="1"/>
      <text x="10" y="18" font-family="monospace" font-size="10" font-weight="700" fill="#FF1E38">TACTICAL CONTROLS GUIDE</text>
      <text x="10" y="38" font-family="monospace" font-size="10" fill="#FFFFFF">• ▲ UP / ▼ DOWN: Navigate Modes</text>
      <text x="10" y="54" font-family="monospace" font-size="10" fill="#FFFFFF">• ● SELECT: Enter / Fire / Ping</text>
      <text x="10" y="70" font-family="monospace" font-size="10" fill="#FFE57F">• ● HOLD SELECT (1.2s): Menu Escape</text>
      <text x="10" y="84" font-family="monospace" font-size="9" fill="#00F0FF">• AUTO-RECOVERY DEBOUNCE: 50ms</text>
    </g>
  </g>
</svg>
