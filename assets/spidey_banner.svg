<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07040D"/>
      <stop offset="45%" stop-color="#140618"/>
      <stop offset="85%" stop-color="#240716"/>
      <stop offset="100%" stop-color="#080D1A"/>
    </linearGradient>

    <!-- Moon Glow -->
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFEFA6" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#FFCC00" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FF3300" stop-opacity="0"/>
    </radialGradient>

    <!-- Suit Red Gradient -->
    <linearGradient id="suitRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2A42"/>
      <stop offset="60%" stop-color="#D6001C"/>
      <stop offset="100%" stop-color="#800010"/>
    </linearGradient>

    <!-- Suit Blue Gradient -->
    <linearGradient id="suitBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E6BFF"/>
      <stop offset="70%" stop-color="#0A2C99"/>
      <stop offset="100%" stop-color="#031045"/>
    </linearGradient>

    <!-- Gold Tingle Glow -->
    <filter id="tingleGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Lens Glow Filter -->
    <filter id="whiteGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes spideySwing {
      0% { transform: translateY(-4px) rotate(-1.5deg); }
      50% { transform: translateY(6px) rotate(2deg); }
      100% { transform: translateY(-4px) rotate(-1.5deg); }
    }
    @keyframes webShoot {
      0% { stroke-dashoffset: 200; opacity: 0.3; }
      50% { stroke-dashoffset: 0; opacity: 1; }
      100% { stroke-dashoffset: -200; opacity: 0.3; }
    }
    @keyframes spiderSenseTingle {
      0%, 100% { opacity: 0.2; transform: scale(0.92); }
      50% { opacity: 1; transform: scale(1.08); }
    }
    @keyframes lensBlink {
      0%, 42%, 58%, 100% { transform: scaleY(1); }
      50% { transform: scaleY(0.18); }
    }
    @keyframes cityLights {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 0.95; }
    }
    @keyframes titleGlow {
      0%, 100% { filter: drop-shadow(0 0 10px #FF1A35); }
      50% { filter: drop-shadow(0 0 20px #FF3B56) drop-shadow(0 0 30px #FFE600); }
    }

    .spidey-character {
      transform-origin: 160px 160px;
      animation: spideySwing 4s ease-in-out infinite;
    }
    .spidey-lens {
      transform-origin: 160px 115px;
      animation: lensBlink 4.5s ease-in-out infinite;
    }
    .spider-sense {
      transform-origin: 160px 110px;
      animation: spiderSenseTingle 1.8s ease-in-out infinite;
    }
    .web-line {
      stroke-dasharray: 20 10;
      animation: webShoot 3s linear infinite;
    }
    .skyline-lights {
      animation: cityLights 2.5s ease-in-out infinite;
    }
    .main-title-glow {
      animation: titleGlow 3.5s ease-in-out infinite;
    }
  </style>

  <!-- Background Canvas -->
  <rect x="0" y="0" width="900" height="320" rx="18" fill="url(#skyGrad)"/>

  <!-- City Skyline Silhouette (Queens / Manhattan at night) -->
  <g fill="#0A040E" opacity="0.85">
    <!-- Far Buildings -->
    <rect x="40" y="160" width="45" height="160"/>
    <rect x="95" y="130" width="35" height="190"/>
    <polygon points="112,90 98,130 126,130"/>
    <rect x="140" y="170" width="50" height="150"/>
    <rect x="200" y="145" width="40" height="175"/>
    <rect x="250" y="120" width="55" height="200"/>
    <rect x="315" y="155" width="45" height="165"/>
    <rect x="370" y="175" width="60" height="145"/>
    <rect x="440" y="135" width="50" height="185"/>
    <rect x="500" y="110" width="40" height="210"/>
    <polygon points="520,70 505,110 535,110"/>
    <rect x="550" y="165" width="55" height="155"/>
    <rect x="615" y="140" width="45" height="180"/>
    <rect x="670" y="125" width="60" height="195"/>
    <rect x="740" y="150" width="50" height="170"/>
    <rect x="800" y="135" width="70" height="185"/>

    <!-- Glowing Yellow/Cyan Windows -->
    <g fill="#FFE600" opacity="0.6" class="skyline-lights">
      <rect x="102" y="140" width="4" height="6"/><rect x="115" y="140" width="4" height="6"/>
      <rect x="102" y="155" width="4" height="6"/><rect x="115" y="170" width="4" height="6"/>
      <rect x="260" y="135" width="5" height="8"/><rect x="280" y="135" width="5" height="8"/>
      <rect x="260" y="155" width="5" height="8"/><rect x="280" y="175" width="5" height="8"/>
      <rect x="510" y="125" width="5" height="7"/><rect x="525" y="140" width="5" height="7"/>
      <rect x="510" y="160" width="5" height="7"/><rect x="685" y="140" width="5" height="7"/>
      <rect x="700" y="155" width="5" height="7"/><rect x="685" y="170" width="5" height="7"/>
      <rect x="815" y="150" width="5" height="8"/><rect x="835" y="165" width="5" height="8"/>
    </g>
  </g>

  <!-- Big Glowing Moon in Background -->
  <circle cx="210" cy="95" r="70" fill="url(#moonGlow)"/>
  <circle cx="210" cy="95" r="48" fill="#FFF7D6" opacity="0.25"/>

  <!-- Left: FULL SPIDER-MAN CHARACTER (Dynamic Swinging Pose) -->
  <g class="spidey-character">
    <!-- Web Line Being Shot from Wrist up to ceiling -->
    <line x1="165" y1="130" x2="280" y2="0" stroke="#FFFFFF" stroke-width="2.5" class="web-line" opacity="0.9" filter="url(#whiteGlow)"/>
    <line x1="165" y1="130" x2="280" y2="0" stroke="#00F0FF" stroke-width="1" opacity="0.7"/>

    <!-- Spider-Sense Tingle Waves radiating around Spidey's Head -->
    <g class="spider-sense" filter="url(#tingleGlow)" stroke="#FFE600" stroke-width="2.2" fill="none">
      <!-- Lightning arcs around head -->
      <path d="M 120,70 Q 110,60 100,68 Q 95,50 85,55"/>
      <path d="M 135,50 Q 130,35 120,40 Q 118,20 105,28"/>
      <path d="M 160,40 Q 160,20 155,25 Q 160,5 150,12"/>
      <path d="M 185,50 Q 190,35 200,40 Q 202,20 215,28"/>
      <path d="M 200,70 Q 210,60 220,68 Q 225,50 235,55"/>
    </g>

    <!-- Spider-Man Body (Torso, Shoulders & Arms in Action Pose) -->
    <!-- Left Arm reaching back for balance -->
    <path d="M 125,120 C 100,125 75,145 60,175 C 68,180 85,160 110,142 Z" fill="url(#suitRed)" stroke="#110206" stroke-width="1.5"/>
    <path d="M 85,160 C 70,185 62,210 55,225 C 65,225 78,200 95,175 Z" fill="url(#suitBlue)" stroke="#050818" stroke-width="1.5"/>
    
    <!-- Right Arm holding the web line -->
    <path d="M 185,120 C 195,110 210,105 225,100 C 220,112 205,125 188,135 Z" fill="url(#suitRed)" stroke="#110206" stroke-width="1.5"/>
    <path d="M 225,100 C 200,110 180,120 165,130 C 160,122 175,110 225,100 Z" fill="url(#suitBlue)" stroke="#050818" stroke-width="1.5"/>
    <!-- Web Shooter Wrist Gauntlet -->
    <ellipse cx="165" cy="130" rx="6" ry="4" fill="#E6001A" stroke="#FFFFFF" stroke-width="1"/>

    <!-- Blue Torso Sides -->
    <path d="M 128,135 C 120,165 125,200 135,225 C 150,230 170,230 185,225 C 195,200 200,165 192,135 Z" fill="url(#suitBlue)"/>

    <!-- Red Center Chest & Abs -->
    <path d="M 136,128 C 142,150 144,185 146,228 C 154,230 166,230 174,228 C 176,185 178,150 184,128 Z" fill="url(#suitRed)"/>

    <!-- Black Chest Spider Emblem -->
    <g fill="#0A0408">
      <ellipse cx="160" cy="155" rx="5" ry="8"/>
      <!-- Spider Legs -->
      <path d="M 160,152 Q 145,142 138,145 Q 146,148 158,154" stroke="#0A0408" stroke-width="2" fill="none"/>
      <path d="M 160,152 Q 175,142 182,145 Q 174,148 162,154" stroke="#0A0408" stroke-width="2" fill="none"/>
      <path d="M 160,156 Q 142,155 135,162 Q 145,160 158,158" stroke="#0A0408" stroke-width="2" fill="none"/>
      <path d="M 160,156 Q 178,155 185,162 Q 175,160 162,158" stroke="#0A0408" stroke-width="2" fill="none"/>
      <path d="M 160,160 Q 145,175 142,185 Q 148,175 159,163" stroke="#0A0408" stroke-width="2" fill="none"/>
      <path d="M 160,160 Q 175,175 178,185 Q 172,175 161,163" stroke="#0A0408" stroke-width="2" fill="none"/>
    </g>

    <!-- Legs in dynamic swing/kick pose -->
    <path d="M 140,225 C 130,250 115,275 95,295 C 105,298 128,275 148,245 Z" fill="url(#suitBlue)" stroke="#050818" stroke-width="1.5"/>
    <path d="M 180,225 C 190,250 205,270 230,285 C 228,272 210,250 192,235 Z" fill="url(#suitBlue)" stroke="#050818" stroke-width="1.5"/>
    <!-- Red Boots -->
    <path d="M 95,295 C 88,305 75,312 60,315 C 68,305 85,298 95,295 Z" fill="url(#suitRed)"/>
    <path d="M 230,285 C 245,292 260,300 275,305 C 265,295 245,288 230,285 Z" fill="url(#suitRed)"/>

    <!-- Spider-Man Mask / Head -->
    <g>
      <!-- Head Contour -->
      <path d="M 160,65 C 188,65 200,85 198,115 C 196,142 178,162 160,168 C 142,162 124,142 122,115 C 120,85 132,65 160,65 Z" 
            fill="url(#suitRed)" stroke="#110206" stroke-width="2"/>
      
      <!-- Head Web Pattern Lines -->
      <g stroke="#1A0207" stroke-width="1.1" fill="none">
        <path d="M 160,65 L 160,168"/>
        <path d="M 160,115 L 126,80 M 160,115 L 194,80"/>
        <path d="M 160,115 L 122,115 M 160,115 L 198,115"/>
        <path d="M 160,115 L 130,150 M 160,115 L 190,150"/>
        <!-- Concentric Curves -->
        <path d="M 138,88 Q 160,100 182,88"/>
        <path d="M 130,115 Q 160,130 190,115"/>
        <path d="M 138,145 Q 160,158 182,145"/>
      </g>

      <!-- Expressive Animated Lenses -->
      <g class="spidey-lens" filter="url(#whiteGlow)">
        <!-- Left Lens (Black Rim + Glowing White Core) -->
        <path d="M 155,108 Q 146,95 128,100 Q 138,126 155,128 Q 158,118 155,108 Z" fill="#000000"/>
        <path d="M 153,110 Q 146,99 132,103 Q 140,123 153,125 Z" fill="#FFFFFF"/>
        <!-- Lens Cyan Shading -->
        <path d="M 132,103 Q 140,123 153,125 Q 145,123 138,115 Z" fill="#D4FAFF" opacity="0.6"/>

        <!-- Right Lens (Black Rim + Glowing White Core) -->
        <path d="M 165,108 Q 174,95 192,100 Q 182,126 165,128 Q 162,118 165,108 Z" fill="#000000"/>
        <path d="M 167,110 Q 174,99 188,103 Q 180,123 167,125 Z" fill="#FFFFFF"/>
        <!-- Lens Cyan Shading -->
        <path d="M 188,103 Q 180,123 167,125 Q 175,123 182,115 Z" fill="#D4FAFF" opacity="0.6"/>
      </g>
    </g>
  </g>

  <!-- Right: Fun, Vibrant Typography & Gadget Info -->
  <!-- Top Tag -->
  <g transform="translate(350, 48)">
    <rect x="0" y="0" width="135" height="22" rx="11" fill="#FF1A35" opacity="0.2"/>
    <rect x="0" y="0" width="135" height="22" rx="11" fill="none" stroke="#FF1A35" stroke-width="1.2"/>
    <text x="14" y="15" font-family="'Segoe UI', -apple-system, sans-serif" font-size="11" font-weight="800" fill="#FF4D66" letter-spacing="1.5">
      🕷️ WEEKEND HACK
    </text>
    <text x="155" y="15" font-family="monospace" font-size="11" fill="#00F0FF">&gt; ESP32 DevKit V1 + ST7735</text>
  </g>

  <!-- Main Headline Title -->
  <g transform="translate(350, 105)" class="main-title-glow">
    <text x="0" y="0" font-family="'Segoe UI', -apple-system, 'Montserrat', Roboto, sans-serif" font-size="46" font-weight="900" fill="#FFFFFF" letter-spacing="3">
      SPIDEY TRACKER
    </text>
  </g>

  <!-- Fun Subtitle / Tagline -->
  <text x="352" y="136" font-family="'Segoe UI', -apple-system, sans-serif" font-size="16" font-weight="600" fill="#FFC72C">
    Built for fun, good vibes, &amp; tracking villains on a Saturday night.
  </text>

  <!-- Feature Pills -->
  <g transform="translate(352, 160)">
    <!-- Pill 1 -->
    <g transform="translate(0, 0)">
      <rect width="118" height="28" rx="6" fill="#1C0A14" stroke="#FF1A35" stroke-width="1.2"/>
      <text x="12" y="18" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">🕷️ SPIDER-TRACER</text>
    </g>
    <!-- Pill 2 -->
    <g transform="translate(126, 0)">
      <rect width="118" height="28" rx="6" fill="#1C0A14" stroke="#FFE600" stroke-width="1.2"/>
      <text x="12" y="18" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#FFE600">⚡ SPIDER-SENSE</text>
    </g>
    <!-- Pill 3 -->
    <g transform="translate(252, 0)">
      <rect width="118" height="28" rx="6" fill="#1C0A14" stroke="#00F0FF" stroke-width="1.2"/>
      <text x="12" y="18" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#00F0FF">🎬 MCU MOVIES</text>
    </g>
    <!-- Pill 4 -->
    <g transform="translate(378, 0)">
      <rect width="118" height="28" rx="6" fill="#1C0A14" stroke="#00FF66" stroke-width="1.2"/>
      <text x="12" y="18" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#00FF66">🎮 WEB GAME</text>
    </g>
  </g>

  <!-- Bottom Quote & Specs -->
  <g transform="translate(352, 225)" font-family="monospace" font-size="12" fill="#8899A6">
    <text x="0" y="0">QUEENS, NY // BEACON 433.92MHz // 6-DOF IMU RADAR</text>
    <text x="0" y="20" fill="#FF4D66" font-weight="700">&gt; "Just a friendly neighborhood ESP32 gadget."</text>
  </g>

  <!-- Border Frame Accent -->
  <rect x="3" y="3" width="894" height="314" rx="15" fill="none" stroke="#FF1A35" stroke-width="1.5" opacity="0.3"/>
</svg>
