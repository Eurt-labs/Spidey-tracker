; ===================================================
; 🕷️ SPIDEY TRACKER — PlatformIO Configuration
; ESP32 DevKit V1 + ST7735 TFT + MPU6050 IMU
; ===================================================

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; --- Libraries ---
lib_deps =
    adafruit/Adafruit ST7735 and ST7789 Library@^1.10.3
    adafruit/Adafruit GFX Library@^1.11.9
    adafruit/Adafruit BusIO@^1.14.5

; --- Build Flags ---
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -Wno-missing-field-initializers
